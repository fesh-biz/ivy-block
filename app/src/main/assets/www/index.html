<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c2117">
  <title>Ivy Block</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- MENU -->
  <section id="screen-menu" class="screen active">
    <div class="menu-deco" aria-hidden="true"></div>
    <div class="logo">
      <div class="logo-blocks" aria-hidden="true">
        <i class="b c1"></i><i class="b c4"></i><i class="b c2"></i><i class="b leafy"></i>
      </div>
      <h1><span class="w1">Ivy</span><span class="w2">Block</span></h1>
      <p class="tagline">Збирай лінії. Рятуй плющ.</p>
    </div>
    <div class="menu-buttons">
      <button id="btn-classic" class="big-btn primary">
        <span class="btn-title">Класика</span>
        <span class="btn-sub" id="classic-sub">Рекорд: 0</span>
      </button>
      <button id="btn-tetris" class="big-btn">
        <span class="btn-title">Тетріс</span>
        <span class="btn-sub" id="tetris-sub">Рекорд: 0</span>
      </button>
      <button id="btn-challenges" class="big-btn">
        <span class="btn-title">Челенджі</span>
        <span class="btn-sub" id="challenges-sub">Рівень 1 з 50</span>
      </button>
    </div>
    <div class="menu-footer">
      <button id="btn-sound" class="icon-btn" aria-label="Звук"></button>
      <button id="btn-vibro" class="icon-btn" aria-label="Вібрація"></button>
      <button id="btn-help" class="icon-btn" aria-label="Як грати"></button>
    </div>
  </section>

  <!-- LEVELS -->
  <section id="screen-levels" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="btn-levels-back" aria-label="Назад"></button>
      <h2>Челенджі</h2>
      <div class="stars-total" id="stars-total"></div>
    </header>
    <div class="level-scroll"><div class="level-grid" id="level-grid"></div></div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <canvas id="canvas"></canvas>
    <header class="hud" id="hud">
      <button class="icon-btn" id="btn-pause" aria-label="Пауза"></button>
      <div class="hud-center">
        <div class="hud-label" id="hud-label"></div>
        <div class="hud-value" id="hud-value">0</div>
      </div>
      <div class="hud-right" id="hud-right"></div>
    </header>
  </section>

  <!-- TETRIS -->
  <section id="screen-tetris" class="screen">
    <canvas id="tcanvas"></canvas>
    <header class="hud" id="thud">
      <button class="icon-btn" id="tbtn-pause" aria-label="Пауза"></button>
      <div class="hud-center">
        <div class="hud-label" id="thud-label"></div>
        <div class="hud-value" id="thud-value">0</div>
      </div>
      <div class="hud-right tstats" id="thud-right"></div>
    </header>
    <div class="tcontrols" id="tcontrols">
      <button class="tbtn" data-k="left" aria-label="Ліворуч"></button>
      <button class="tbtn" data-k="right" aria-label="Праворуч"></button>
      <button class="tbtn" data-k="soft" aria-label="Прискорити"></button>
      <button class="tbtn" data-k="drop" aria-label="Скинути"></button>
      <button class="tbtn" data-k="ccw" aria-label="Повернути проти годинникової стрілки"></button>
      <button class="tbtn" data-k="cw" aria-label="Повернути за годинниковою стрілкою"></button>
    </div>
  </section>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
</div>
<script src="logic.js"></script>
<script src="tetris.js"></script>
<script src="game.js"></script>
<script src="tetris-ui.js"></script>
</body>
</html>
